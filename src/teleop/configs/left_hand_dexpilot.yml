retargeting:
  type: DexPilot
  urdf_path: left_hand.urdf

  # 6 actuated joints, in register order reg0..reg5. Distal joints are coupled
  # via <mimic> in the URDF and must NOT be listed here.
  #   reg0 thumb opposition/yaw, reg1 thumb flex, reg2..5 index/middle/ring/pinky flex
  target_joint_names: [ 'hand_l_thumb_joint1', 'hand_l_thumb_joint2',
                        'hand_l_index_joint1', 'hand_l_middle_joint1',
                        'hand_l_ring_joint1',  'hand_l_pinky_joint1' ]

  wrist_link_name: "hand_l_base_link"
  finger_tip_link_names: [ "hand_l_thumb_tip", "hand_l_index_tip", "hand_l_middle_tip",
                           "hand_l_ring_tip", "hand_l_pinky_tip" ]

  scaling_factor: 1.0
  low_pass_alpha: 0.25
